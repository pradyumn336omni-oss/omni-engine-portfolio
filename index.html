<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Engine | Enterprise Data Ingestion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --success: #10b981;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .title span {
            color: var(--primary);
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        select {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            background-color: var(--surface);
            cursor: pointer;
            outline: none;
        }
        .status {
            font-size: 13px;
            font-weight: 600;
            color: var(--success);
            background: #d1fae5;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }
        .metric-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }
        .metric-title {
            font-size: 13px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .metric-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--text);
        }
        .table-container {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 18px 24px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: #f8fafc;
            font-weight: 600;
            font-size: 13px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td {
            font-size: 14px;
            color: #334155;
        }
        .total-col {
            font-weight: 600;
            color: var(--text);
        }
        .source-tag {
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">OMNI <span>ENGINE</span></div>
        <div class="controls">
            <select id="currency-selector">
                <option value="USD">USD - US Dollar</option>
                <option value="INR">INR - Indian Rupee</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - British Pound</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="AUD">AUD - Australian Dollar</option>
                <option value="CAD">CAD - Canadian Dollar</option>
            </select>
            <div class="status">● Pipeline Active</div>
        </div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-title">Total Invoices Processed</div>
            <div class="metric-value" id="count-metric">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Total Fiat Extracted (<span id="currency-label">USD</span>)</div>
            <div class="metric-value" id="fiat-metric">0.00</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">System Integrity</div>
            <div class="metric-value" style="color: var(--success);">100%</div>
        </div>
    </div>

    <!-- RESPONSIVE PATCH APPLIED HERE -->
    <div class="table-container" style="overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch;">
        <table style="min-width: 800px;">
            <thead>
                <tr>
                    <th>Source Document</th>
                    <th>Client Name</th>
                    <th>Contact Email</th>
                    <th>Transaction Date</th>
                    <th>Total Billed</th>
                </tr>
            </thead>
            <tbody id="ledger-data">
                <!-- Javascript Injection -->
            </tbody>
        </table>
    </div>

    <script>
        // System Architecture: Async Data Handling & Live Forex Routing
        let globalLedgerData = [];
        let exchangeRates = {};
        let currentCurrency = 'USD';

        const currencySymbols = {
            'USD': '$',
            'INR': '₹',
            'EUR': '€',
            'GBP': '£',
            'JPY': '¥',
            'AUD': 'A$',
            'CAD': 'C$'
        };

        async function initializeSystem() {
            try {
                // Phase 1: Fetch Live Global Exchange Rates
                const forexResponse = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                if (!forexResponse.ok) throw new Error("Forex API Unavailable");
                const forexData = await forexResponse.json();
                exchangeRates = forexData.rates;

                // Phase 2: Fetch Local Secure JSON Payload
                const ledgerResponse = await fetch('commercial_ledger.json?nocache=' + new Date().getTime());
                if (!ledgerResponse.ok) throw new Error("Local Data Unreachable");
                globalLedgerData = await ledgerResponse.json();

                // Phase 3: Render Interface
                renderDashboard();
            } catch (error) {
                console.error('System Ignition Failure:', error);
                document.getElementById('ledger-data').innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">Initialization Error: ${error.message} <br> Ensure Python core is running and internet is connected.</td></tr>`;
            }
        }

        function renderDashboard() {
            const tableBody = document.getElementById('ledger-data');
            
            let totalRecords = 0;
            let totalFiatUSD = 0.0;
            const rate = exchangeRates[currentCurrency] || 1;
            const symbol = currencySymbols[currentCurrency] || currentCurrency;

            // 1. Create an empty string buffer instead of touching the HTML directly
            let htmlBuffer = "";

            globalLedgerData.forEach(client => {
                totalRecords++;
                
                let amountString = String(client.CalculatedTotal || "0");
                let numericAmount = parseFloat(amountString.replace(/[^0-9.-]+/g,""));
                if (!isNaN(numericAmount)) {
                    totalFiatUSD += numericAmount;
                }

                let convertedAmount = numericAmount * rate;

                // 2. Add the row to the string buffer
                htmlBuffer += `<tr>
                    <td><span class="source-tag">${client.SourceReference || 'Unknown'}</span></td>
                    <td>${client.ClientName || '-'}</td>
                    <td>${client.ContactEmail || '-'}</td>
                    <td>${client.TransactionDate || '-'}</td>
                    <td class="total-col">${symbol}${convertedAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                </tr>`;
            });

            // 3. Inject the entire buffer into the HTML EXACTLY ONCE
            tableBody.innerHTML = htmlBuffer;

            // Update Master Metrics
            let convertedTotalFiat = totalFiatUSD * rate;
            document.getElementById('count-metric').innerText = totalRecords;
            document.getElementById('currency-label').innerText = currentCurrency;
            document.getElementById('fiat-metric').innerText = symbol + convertedTotalFiat.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        // Event Listener: Trigger recalculation when dropdown changes
        document.getElementById('currency-selector').addEventListener('change', function(e) {
            currentCurrency = e.target.value;
            renderDashboard();
        });

        // Ignite Pipeline
        initializeSystem();
    </script>

</body>
</html>
